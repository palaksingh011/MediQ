<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediQ - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="logo-section">
      <img
        src="kp.jpeg"
        alt="MediQ Logo"
        class="logo"
      />
      <h2 class="subtitle">Your Intelligent Hospital Guide</h2>
    </header>

    <main class="form-section">
      <h1>Welcome Back</h1>
      <p class="form-desc">Sign in to continue your journey</p>
      <form id="login-form" autocomplete="off" novalidate>
        <input
          type="text"
          placeholder="Username"
          aria-label="Username"
          required
          autocomplete="username"
        />
        <input
          type="password"
          placeholder="Password"
          aria-label="Password"
          required
          autocomplete="current-password"
        />
        <button type="submit" class="primary-btn">Log In</button>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </form>
      <div class="separator"><span>or</span></div>
      <p class="switch-link">
        New User? <a href="signup.html">Create an account</a>
      </p>
    </main>

    <footer class="footer-note">
      <p>© 2025 MediQ, All Rights Reserved.</p>
    </footer>
  </div>
</body>
</html>
