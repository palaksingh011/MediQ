<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediQ - Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="logo-section">
      <img
        src="kp.jpeg"
        alt="MediQ Logo"
        class="logo"
      />
      <h2 class="subtitle">Your Intelligent Hospital Guide</h2>
    </header>

    <main class="form-section">
      <h2>Create a new account</h2>
      <form id="signup-form" autocomplete="off" novalidate>
        <input
          type="text"
          placeholder="Full Name"
          aria-label="Full Name"
          required
          autocomplete="name"
        />
        <input
          type="email"
          placeholder="Email"
          aria-label="Email"
          required
          autocomplete="email"
        />
        <input
          type="password"
          placeholder="Create Password"
          aria-label="Create Password"
          required
          autocomplete="new-password"
        />
        <button type="submit" class="secondary-btn">Sign Up</button>
      </form>
      <div class="separator"><span>or</span></div>
      <p class="switch-link">
        Already have an account? <a href="index.html">Log in</a>
      </p>
    </main>

    <footer class="footer-note">
      <p>© 2025 MediQ, All Rights Reserved.</p>
    </footer>
  </div>
</body>
</html>
